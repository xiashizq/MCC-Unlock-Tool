name: Build and Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0"
        required: true
        default: "v1.3.0"
      title:
        description: "Release title (optional, defaults to the tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows MSVC Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\halounlocktool.pro -spec win32-msvc "CONFIG+=release"
          nmake release

      - name: Package with windeployqt
        shell: pwsh
        run: |
          $out = "package/MCC-Unlock-Tool"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "build\release\halounlocktool.exe" "$out\MCC-Unlock-Tool.exe"
          windeployqt --release --compiler-runtime --dir $out "$out\MCC-Unlock-Tool.exe"
          foreach ($dll in @("Qt5Xml.dll", "Qt5Svg.dll")) {
            $src = Join-Path $env:QT_ROOT_DIR "bin\$dll"
            if ((Test-Path $src) -and -not (Test-Path "$out\$dll")) {
              Copy-Item $src $out
            }
          }
          Compress-Archive -Path "$out\*" -DestinationPath "MCC-Unlock-Tool-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCC-Unlock-Tool-windows-x64
          path: MCC-Unlock-Tool-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title != '' && github.event.inputs.title || github.event.inputs.tag }}
          files: MCC-Unlock-Tool-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
